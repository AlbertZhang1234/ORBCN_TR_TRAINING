services:
  invoice-processing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice-processing
    ports:
      - "8201:8201"
    env_file:
      - .env
    environment:
      INVOICE_SERVICE_HOST: 0.0.0.0
      INVOICE_SERVICE_PORT: 8201
      # MinerU may fail in constrained docker envs; keep fallback extractor stable.
      INVOICE_DISABLE_MINERU: "1"
      # Ensure container can reach host LLM endpoint.
      INVOICE_LLM_BASE_URL: http://host.docker.internal:8666/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
